<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch the Stars</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: linear-gradient(to bottom, #101035, #050514);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    #gameContainer {
        width: 90vw;
        max-width: 600px;
        height: 80vh;
        max-height: 700px;
        background: linear-gradient(to bottom, #17175c, #080820);
        border: 3px solid #ffffff;
        border-radius: 15px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 30px #5b5bff;
    }

    #scoreBoard {
        position: absolute;
        top: 15px;
        left: 20px;
        font-size: 22px;
        font-weight: bold;
        z-index: 10;
    }

    #player {
        position: absolute;
        bottom: 20px;
        width: 90px;
        height: 25px;
        background: #00d9ff;
        border-radius: 15px;
        box-shadow: 0 0 15px #00d9ff;
    }

    .star {
        position: absolute;
        font-size: 30px;
        user-select: none;
    }

    #startScreen,
    #gameOverScreen {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 20;
        text-align: center;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 15px;
    }

    p {
        margin-bottom: 20px;
        font-size: 18px;
    }

    button {
        padding: 14px 30px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #00d9ff;
        color: #050514;
        font-weight: bold;
        transition: 0.2s;
    }

    button:hover {
        transform: scale(1.08);
        background: white;
    }

    #gameOverScreen {
        display: none;
    }

    #finalScore {
        font-size: 24px;
        margin-bottom: 20px;
    }

    .instructions {
        position: absolute;
        bottom: 8px;
        font-size: 13px;
        opacity: 0.7;
    }
</style>
</head>

<body>

<div id="gameContainer">

    <div id="scoreBoard">
        Score: <span id="score">0</span>
    </div>

    <div id="player"></div>

    <div id="startScreen">
        <h1>⭐ Catch the Stars</h1>
        <p>Move left and right to catch the falling stars!</p>
        <button onclick="startGame()">Start Game</button>
        <div class="instructions">
            Use ← → arrow keys
        </div>
    </div>

    <div id="gameOverScreen">
        <h1>Game Over!</h1>
        <div id="finalScore"></div>
        <button onclick="startGame()">Play Again</button>
    </div>

</div>

<script>

const gameContainer = document.getElementById("gameContainer");
const player = document.getElementById("player");
const scoreDisplay = document.getElementById("score");
const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const finalScore = document.getElementById("finalScore");

let playerX = 250;
let score = 0;
let gameRunning = false;
let stars = [];
let animationId;
let spawnInterval;

const playerSpeed = 8;

let keys = {
    left: false,
    right: false
};


// Keyboard controls

document.addEventListener("keydown", (event) => {

    if (event.key === "ArrowLeft") {
        keys.left = true;
    }

    if (event.key === "ArrowRight") {
        keys.right = true;
    }

});


document.addEventListener("keyup", (event) => {

    if (event.key === "ArrowLeft") {
        keys.left = false;
    }

    if (event.key === "ArrowRight") {
        keys.right = false;
    }

});


// Start game

function startGame() {

    score = 0;
    scoreDisplay.textContent = score;

    playerX = gameContainer.clientWidth / 2 - 45;
    player.style.left = playerX + "px";

    stars.forEach(star => star.element.remove());
    stars = [];

    startScreen.style.display = "none";
    gameOverScreen.style.display = "none";

    gameRunning = true;

    clearInterval(spawnInterval);

    spawnInterval = setInterval(createStar, 800);

    gameLoop();
}


// Create falling star

function createStar() {

    if (!gameRunning) return;

    const starElement = document.createElement("div");

    starElement.classList.add("star");
    starElement.textContent = "⭐";

    const x = Math.random() * (gameContainer.clientWidth - 30);

    starElement.style.left = x + "px";
    starElement.style.top = "0px";

    gameContainer.appendChild(starElement);

    stars.push({
        element: starElement,
        x: x,
        y: 0,
        speed: 2 + Math.random() * 3
    });

}


// Main game loop

function gameLoop() {

    if (!gameRunning) return;


    // Move player

    if (keys.left) {
        playerX -= playerSpeed;
    }

    if (keys.right) {
        playerX += playerSpeed;
    }


    // Keep player inside game area

    if (playerX < 0) {
        playerX = 0;
    }

    if (playerX > gameContainer.clientWidth - player.clientWidth) {
        playerX = gameContainer.clientWidth - player.clientWidth;
    }

    player.style.left = playerX + "px";


    // Move stars

    for (let i = stars.length - 1; i >= 0; i--) {

        const star = stars[i];

        star.y += star.speed;

        star.element.style.top = star.y + "px";


        const starRect = star.element.getBoundingClientRect();
        const playerRect = player.getBoundingClientRect();


        // Collision detection

        if (
            starRect.bottom >= playerRect.top &&
            starRect.top <= playerRect.bottom &&
            starRect.right >= playerRect.left &&
            starRect.left <= playerRect.right
        ) {

            score++;

            scoreDisplay.textContent = score;

            star.element.remove();
            stars.splice(i, 1);

            continue;
        }


        // Star missed

        if (star.y > gameContainer.clientHeight) {

            star.element.remove();
            stars.splice(i, 1);

            endGame();
        }

    }


    animationId = requestAnimationFrame(gameLoop);

}


// End game

function endGame() {

    gameRunning = false;

    cancelAnimationFrame(animationId);

    clearInterval(spawnInterval);

    finalScore.textContent = "Your Score: " + score;

    gameOverScreen.style.display = "flex";

}

</script>

</body>
</html>
